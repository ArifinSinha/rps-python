<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rock Paper Scissors</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="arena">
  <h1>RPS ARENA</h1>

  <div id="nameGate" class="name-gate">
    <label for="nameInput">What's your name?</label>
    <div class="name-row">
      <input type="text" id="nameInput" placeholder="PlayerOne" maxlength="20">
      <button id="nameSubmit">Start</button>
    </div>
    <label style="margin-top:14px;">Match length</label>
    <div class="bestof-row">
      <button class="bestof-btn selected" data-bestof="3">Best of 3</button>
      <button class="bestof-btn" data-bestof="5">Best of 5</button>
      <button class="bestof-btn" data-bestof="7">Best of 7</button>
    </div>
  </div>

  <div id="gameArea" class="game-area" style="display:none;">
    <div class="scoreboard">
      <div class="side">
        <div class="label" id="youLabel">You</div>
        <div class="score" id="youScore">0</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="side">
        <div class="label">Python</div>
        <div class="score" id="cpuScore">0</div>
      </div>
    </div>

    <div class="stage">
      <div class="hand" id="youHand">?</div>
      <div class="bolt">VS</div>
      <div class="hand" id="cpuHand">?</div>
    </div>

    <div id="resultBanner" class="result-banner">Pick your weapon</div>
    <div id="gameCount" class="game-count"></div>
    <div id="history" class="history"></div>
    <div id="matchOverBanner" class="match-over" style="display:none;">
      <div id="matchOverText"></div>
      <button id="newMatchBtn">New Match</button>
    </div>

    <div class="choices">
      <button class="choice-btn rock" data-choice="1">
        <span class="icon"></span>ROCK
      </button>
      <button class="choice-btn paper" data-choice="2">
        <span class="icon"></span>PAPER
      </button>
      <button class="choice-btn scissors" data-choice="3">
        <span class="icon"></span>SCISSORS
      </button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
